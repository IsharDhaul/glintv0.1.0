[project]
name = "glint"
version = "0.0.1"
description = "Fundamentals-first US stock screener: data engine, CLI and API"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.3.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "orjson>=3.13.0",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pytz>=2026.5",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
glint = "glint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glint"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "PTH", "PL", "T20", "DTZ"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "E501"]
"scripts/**" = ["T20"]

[tool.pyright]
include = ["glint", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "live: hits the real network (SEC, price providers); never runs in CI",
    "slow: takes more than a few seconds",
    "perf: timing budgets; CI only (`make perf` runs them locally, on a quiet machine)",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]
