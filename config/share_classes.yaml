  - cik: "0000789933"
    ticker: NC
    accn: "0000789933-26-000070"
    source: "NACCO Industries 10-K FY2025, cover page (Section 12(b) and 12(g) securities)"
    quote: >-
      Class A Common Stock, $1 par value per share | NC | New York Stock Exchange
      Class A Common Stock, $1 par value per share | NC | NYSE Texas
      Securities registered pursuant to Section 12(g) of the Act: Class B Common Stock, $1 par
      value per share. Class B Common Stock is not publicly listed for trade on any exchange or
      market system; however, Class B Common Stock is convertible into Class A Common Stock on a
      share-for-share basis.
