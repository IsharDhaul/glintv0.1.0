# cover_symbols format (the cover's XBRL tags no dei:TradingSymbol on any class):
#   - cik: "0000000000"
#     ticker: the company's primary listing
#     accn: the 10-K the quote comes from
#     source: the filing and section
#     quote: verbatim rows of the cover's "Title of each class / Trading Symbol(s) / Name of each
#       exchange" table (cells joined with " | ", line breaks inside a cell as " / ")
#     symbols: {<StatementClassOfStockAxis member>: <symbol as the cover table states it>}
#     checked_by: who read the filing, and when
# RPC's Class A symbol is recorded, but its unlisted Class B has no `unlisted_economic` entry (the
# 10-K's Ex 4.1 says Class B dividends are "equivalent" and that Class B is "not entitled to
# dividends"; docs/decisions/WT-01.md 2026-11-23), so it keeps its single count.
# Molson Coors (TAP) is not here: both its classes are listed (TAP.A, TAP), but the cover misses
# its exchangeable shares, so it is in `cover_excluded` below.
