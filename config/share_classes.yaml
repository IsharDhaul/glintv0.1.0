# Share classes for market cap (SPEC §4.3 rule 11). WT-01 owns this file.
# Market cap = Σ class shares_outstanding × that class's own close (WT-06, metrics/share_classes.py).
# Three sources, all read from the latest 10-K/10-Q cover by the universe build
# (companies.parquet `listed_classes`, universe/listed_classes.py) unless keyed in `companies`:
#   1. Every cover-page common class has its own trading symbol (BRK.A/BRK.B, HEI/HEI.A,
#      LEN/LEN.B): no entry needed.
#   2. `unlisted_economic` (below): a class with no symbol of its own whose economics the filing
#      says, in the quoted words, are the same as a listed class's (dividends, liquidation; votes
#      and conversion aside). It is priced at the close of the listed class it converts into
#      (`priced_at`). Counts are never keyed here: each build sums the cover's classes. A named
#      member missing from the latest cover gives no entry (logged) and the single count stays.
#   2b. `cover_symbols` (below): for a cover whose XBRL gives no class a symbol Glint reads (NC
#      and RPC tag `dei:TradingSymbol` only by listing exchange), each class's symbol from the 10-K cover's "Title of each class / Trading
#      Symbol(s)" table, quoted verbatim. A class the cover tags no symbol for takes the configured
#      one (the cover's own tag wins). It only says which class is listed: an unlisted class still
#      needs its `unlisted_economic` entry. A configured member missing from the cover is logged.
#   3. `companies`: hand-keyed counts, only when neither the cover nor a quote can supply them.
#      None today; an entry here wins for its CIK.
# Never assume an unlisted class is economic (user decision, 2026-11-22): no quote, no entry.
# Voting-only classes (DKNG's or ACN's Class X, MDLN's Class B) are never added; see
# docs/decisions/WT-01.md 2026-11-22. Up-Cs (companies.parquet `is_up_c`) are out of scope: their
# economic count comes from the up_c rules in config/sectors.yaml.
# Berkshire Hathaway (CIK 0001067983) was keyed in `companies` until 2026-11-22; both its classes are
# listed on the cover, so it comes from there. Hub Group and Duolingo were keyed there until
# 2026-11-22 (feat-unlisted-economic-classes); their quotes moved to `unlisted_economic`.
companies: []

# unlisted_economic format:
#   - cik: "0000000000"
#     ticker: the company's primary listing
#     source: the filing and section the quote comes from
#     accn: that filing's accession number
#     quote: verbatim; the classes' economic rights are the same apart from voting/conversion
#     conversion: verbatim, when the filing states one (never invented); optional
#     classes: [{member: <StatementClassOfStockAxis member>, priced_at: <listed ticker>}]
#     non_economic: [{member, quote}]  # optional: cover classes with no economic rights, never summed
#     checked_by: who read the filing, and when
unlisted_economic:
  - cik: "0001652044"
    ticker: GOOGL
    source: "Alphabet 10-K FY2025, Note 11 (Stockholders' Equity)"
    accn: "0001652044-26-000018"
    quote: >-
      The rights of the holders of each class of our common and capital stock are identical,
      except with respect to voting. [...] In accordance with our certificate of incorporation,
      the rights, including the liquidation and dividend rights, of the holders of our Class A,
