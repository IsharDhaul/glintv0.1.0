# Left Unclassified on purpose: 8880 (ADRs: says nothing about the business), 8900, 9995.
# Kinds (excluded from the default universe), by SIC code.
kinds:
  - {sic: [6722, 6726], kind: fund}
  - {sic: [6770], kind: spac}
# Funds rarely carry SIC 6722/6726 on EDGAR (0 of 8,023 listed CIKs on 2026-10-29); closed-end
# funds have a blank SIC. A blank-SIC registrant is a fund if its entityType is "investment" or
# its recent filings include any of these investment-company forms (WT-01 decision).
fund_entity_types: [investment]
fund_forms: [N-CSR, N-CSRS, NPORT-P, NPORT-EX, N-CEN, N-2, N-2/A, 485BPOS, N-PX, 24F-2NT]
# Issuers with no listed common stock (kind no_common_equity; universe/classify.py,
# `no_common_equity_reason`). Rule A: no ticker is common stock by symbol. Rule B: the latest
# 10-K/10-Q/20-F/40-F reports at most `max_cover_shares` common shares on its cover page
# (undimensioned dei:EntityCommonStockSharesOutstanding) and no diluted EPS or diluted share
# count has a period end in the last `per_share_lookback_months`. On 2026-10-30's data: TVA,
# NRUC, CHS (0), Qwest (1), Brookfield Property Partners (0), American National (10,000).
# Athene (203,805, all held by Apollo) is above it on purpose: 250,000 would also catch crypto
# ETFs (VBNB, CTWO, SOLC), which are misclassified funds, not issuers without common stock.
no_common_equity:
  max_cover_shares: 10000
  per_share_lookback_months: 24
# Up-C detection (universe/upc.py) from the latest 10-K/10-Q's own XBRL (ingest/sec/covers.py):
# 2+ common classes on the cover page, and a class of at least `min_class_share` of the total
# whose share is within `nci_tolerance` of the NCI ownership % the filing tags. Then market cap
# counts every cover-page common class (financials/shares.py). On 2026-11-03's scan: 35 domestic
# Up-Cs. min_class_share 0.04 drops ALIT, AMH, CHCI and ACN (classes of 0.03–2.2%) and keeps
# PTLO (Class B 4.5%, NCI tagged on that class); UONEK still matches by coincidence (Reach Media
# NCI 5.4% vs Class B 6.2%), harmlessly: its classes are all economic, so the sum is its total.
# The NCI % is also compared with the rest of the cover (1 − one class's share): TWFG's two
# unlisted classes (B + C) are 76.2%, NCI 76.3%. Tolerance stays 1pp: at 3pp RDDT, EZPW, CENT
# and ZEO match by coincidence (2026-11-22 scan of 4,455 cached covers).
# confirmed: Up-Cs the rule can't see (no NCI % tagged, or tagged at a balance-sheet date far
#   from the cover date, or only for subsidiaries). Each quotes the filing on the 1:1 pairing of
#   the unlisted class with exchangeable units; the count is still the sum of the latest cover's
#   classes. `classes` (optional) names the cover members to sum, e.g. [CommonClassA, ...].
#   `structure` (optional, default "Up-C") names what was confirmed, in the evidence text.
# excluded: multi-class filers whose extra class has no economics and no paired unit; never an
#   Up-C, even if the rule matches. Wins over confirmed and the rule.
# candidate_min_ratio: `glint universe --up-c-candidates` lists a cover only if its total is at
#   least this multiple of Glint's latest shares_outstanding (or Glint has no count). Below it,
#   Glint's count already includes the other classes and summing would change little.
# total_member_tolerance: with 3+ cover class members, one whose shares equal the sum of all the
#   others within this fraction is their total, not another class (GCT, KNSA tag a
#   CommonStockMember = the sum of their class members; ZETA a CommonClassAAndCommonClassB).
# non_equity_symbol_words: `--up-c-candidates` drops a cover whose classes trade under 2+
#   symbols (separately listed classes), but a cover also tags symbols on warrants, rights,
#   preferred, depositary shares and notes. A symbol counts only if its class member's local name
#   (after the prefix, e.g. WarrantsEachWholeWarrant...Member) contains none of these words,
#   matched case-insensitively. From VGAS (#78): its warrant symbol VGASW hid it from the list.
up_c:
  nci_tolerance: 0.01
  min_class_share: 0.04
  candidate_min_ratio: 1.05
  total_member_tolerance: 0.005
  non_equity_symbol_words: [Warrant, Right, Preferred, Depositary, Note, Debenture]
